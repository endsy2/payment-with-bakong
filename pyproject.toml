[tool.poetry]
name = "payment-with-bakong"
version = "0.1.0"
description = "FastAPI service with Bakong KHQR and PostgreSQL"
authors = ["endsy2"]
readme = "README.md"
packages = []
# Important: disable package mode for FastAPI app
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.121.1"
uvicorn = { extras = ["standard"], version = "^0.38.0" }
python-dotenv = "^1.0.1"
bakong-khqr = "^0.4.15"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.9"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
